# RainAlert — local Docker setup
#
#   docker compose up --build      start the app on http://localhost:8000
#   docker compose run --rm tests  run the test suites inside the image
#   docker compose down            stop and remove the container
#
# The app is stateless, so there is no database service to run.

# Both services run the same image, and it is built from the source in this
# directory, so the image is defined once here and the two services cannot
# drift apart.
#
# `pull_policy: build` is what makes that true in practice. Without it
# Compose runs the local `rainalert:latest` whenever it exists, and a local
# image is never rebuilt on its own — so "docker compose run --rm tests"
# quietly tests a stale image and reports the result of yesterday's code.
# It happened here: a stale `rainalert:latest` ran 368 of the 513 offline
# tests and still said OK. Needs Compose v2.20 or later.
x-image: &image
  image: rainalert:latest
  build:
    context: .
    dockerfile: Dockerfile
  pull_policy: build

services:
  rainalert:
    <<: *image
    container_name: rainalert
    ports:
      # host:container. Change the host side if 8000 is already in use.
      - "8000:8000"
    environment:
      # Identify this deployment to Nominatim. Its usage policy asks callers
      # to say who they are, and the default identifies the development copy.
      NOMINATIM_USER_AGENT: RainAlert_App_v1_2026
      GEOCODER_TIMEOUT: "10"
      WEATHER_TIMEOUT: "10"
      WEATHER_CACHE_SECONDS: "600"
      # The site's own address, for the canonical links, the social card and
      # the sitemap. It defaults to the real address, so a container and a
      # local run agree; set SITE_URL in the .env file to change it.
      SITE_URL: ${SITE_URL:-https://rainalert.live}
      # Optional donation link. Compose fills this in from the shell or from
      # the .env file next to this file; empty (the default) hides the link.
      DONATION_URL: ${DONATION_URL:-}
      # The app's own tunables, so a container can be tuned from the .env
      # file rather than by editing this one. The defaults are the app's own
      # (see rainalert/config.py), so a container and a local run agree.
      UMBRELLA_THRESHOLD: ${UMBRELLA_THRESHOLD:-50}
      SEVERITY_LOW_MAX: ${SEVERITY_LOW_MAX:-30}
      SEVERITY_MODERATE_MAX: ${SEVERITY_MODERATE_MAX:-60}
      TEMPERATURE_UNIT: ${TEMPERATURE_UNIT:-celsius}
    restart: unless-stopped
    healthcheck:
      # The app has no dedicated health endpoint, so this asks for the home
      # page. A 200 means the server is up and serving.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # A one-shot service that runs the test suites in the same image. It shares
  # the build, so the image is built once and the tests exercise exactly what
  # gets deployed.
  #
  # The two HTTP suites run here. The browser suite is not in the image: it
  # drives a real headless Chrome, and the image installs no system packages
  # on purpose, so it runs on the CI runner instead.
  tests:
    <<: *image
    profiles: ["test"]
    environment:
      NOMINATIM_USER_AGENT: RainAlert_App_v1_2026
      # SITE_URL is deliberately not set here. The offline suite asserts the
      # canonical address of the site, so it has to run against the default.
      # The tunables are left out for the same reason: the suite asserts the
      # app's own defaults, so a value in the .env file must not reach the
      # container the tests run in.
    command: >
      sh -c "python -m unittest discover -s tests/offline -t . -v && python -m unittest tests.test_api -v"
