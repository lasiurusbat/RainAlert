# Render Blueprint for RainAlert (free web service, prebuilt Docker Hub image).
# Nothing deploys until this repo is connected to Render and the Blueprint is
# created there. Render does not rebuild anything: it pulls the image below.
#
# A release is a git tag, not a change to this file. The workflow builds the
# image, tags it with the number of the release, pushes it, and calls the
# deploy hook with that same tag. The tag below is only the fallback for a
# manual deploy, so do not bump it as part of an ordinary change; DEPLOY.md
# says when it has to move.
#
# If the Docker Hub repository is private, add a registry credential in Render
# (Workspace Settings) and add under `image:`
#   creds:
#     fromRegistryCreds:
#       name: <credential name>
services:
  - type: web
    # The live service's name. Its onrender.com address is still
    # rainalert-1-0.onrender.com, because Render fixes the subdomain when the
    # service is created and a rename does not change it. The domain's CNAME
    # points at that address, so DNS needs no change.
    name: rainalert
    runtime: image
    plan: free
    image:
      url: docker.io/lasiurusbat/rainalert:1.1.2
    # The image is deployed by the hook, which names the tag it wants. Left
    # on, auto-deploy would redeploy the service with the image stored above
    # - the fallback tag - as soon as any image was pushed, which is how an
    # old version comes back.
    autoDeploy: false
    # The app has no separate health endpoint: its home page is the app's own
    # page, and a 200 from it means the server is up and serving.
    healthCheckPath: /
    envVars:
      # The site's own address. The canonical links, the social card, the
      # sitemap and the structured data are all built from it, and a
      # canonical link pointing somewhere other than where the site lives is
      # worse than none at all.
      - key: SITE_URL
        value: "https://rainalert.live"
      - key: NOMINATIM_USER_AGENT
        value: "RainAlert/1.0 (https://rainalert.live)"
      - key: GEOCODER_TIMEOUT
        value: "10"
      - key: WEATHER_TIMEOUT
        value: "10"
      # Optional donation link. Voluntary one-off donations only: Open-Meteo's
      # free terms are non-commercial, so the page behind this link must not
      # sell memberships, extras or subscriptions. Remove the line to hide it.
      - key: DONATION_URL
        value: https://buymeacoffee.com/rainalert
