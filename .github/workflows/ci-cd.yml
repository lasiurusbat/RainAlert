# CI/CD for RainAlert.
#
#   pull request / push to main : build the image, run the offline tests inside it
#   push of a tag like v0.9     : the same, then push the image to Docker Hub and
#                                 tell Render to deploy that exact tag
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME        e.g. lasiurusbat
#   DOCKERHUB_TOKEN           Docker Hub access token with Read & Write scope
#   RENDER_DEPLOY_HOOK_URL    the service's deploy hook URL from Render settings
name: ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# A newer push to the same branch cancels the older run. Release tags are never
# cancelled half way through a push or deploy.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: lasiurusbat/rainalert

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the image version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "Tag '$GITHUB_REF_NAME' must look like v0.9 or v1.2.3." >&2
              exit 1
            fi
            # Releases are only cut from commits that are already on main.
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Tag '$GITHUB_REF_NAME' is not on main; refusing to release it." >&2
              exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      # The tests run inside the image, so that what is tested is exactly
      # what will be shipped. The suite needs no locale any more: the
      # weekday names are hard-coded, so it passes on a stock runner too.
      - name: Build image (linux/amd64, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run offline tests in the image
        run: docker run --rm "$IMAGE:${{ steps.version.outputs.version }}" python -m unittest test_app -v

      # The browser suite drives a real headless Chrome, so it cannot run in
      # the image: the image installs no system packages, on purpose. The
      # runner has Chrome already, so the suite runs here instead, against
      # the same source. It sits before the push, so a failing browser test
      # means the image is never pushed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app and the browser driver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the browser tests
        env:
          # A skipped suite still reports success, and a suite that tested
          # nothing must not pass the gate. This turns a missing browser
          # into a failure.
          RAINALERT_REQUIRE_BROWSER: "1"
        run: python -m unittest test_browser -v

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the tested image
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker push "$IMAGE:${{ steps.version.outputs.version }}"

  deploy:
    needs: build-test-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings -> Environments)
    # if you want a manual approval before each production deploy.
    environment: production
    steps:
      - name: Tell Render to deploy this tag
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERSION: ${{ needs.build-test-push.outputs.version }}
        run: |
          img="docker.io/${IMAGE}:${VERSION}"
          enc=$(jq -rn --arg u "$img" '$u|@uri')
          curl --fail --silent --show-error -X POST "${HOOK}&imgURL=${enc}" > /dev/null
          echo "Deploy requested for ${img}"

      # Render needs a while to pull the image, and a free service may be asleep.
      - name: Smoke test the live site
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 12 --retry-delay 15 --retry-all-errors --max-time 90 \
            https://rainalert.live/
